<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f4f6fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 650px;
      }

      h2 {
        font-size: 24px;
        color: #111;
        margin-bottom: 24px;
        position: relative;
        display: inline-block;
      }

      h2::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -4px;
        width: 30px;
        height: 3px;
        background-color: #4f75ff;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        font-size: 14px;
        color: #333;
        margin-bottom: 8px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"] {
        padding: 12px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        font-size: 14px;
        color: #333;
        outline: none;
        transition: border-color 0.2s;
      }

      input::placeholder {
        color: #b3b3b3;
      }

      input:focus {
        border-color: #9b51e0;
      }

      .gender-section {
        margin-bottom: 30px;
      }

      .gender-title {
        font-weight: 600;
        font-size: 16px;
        color: #111;
        margin-bottom: 12px;
      }

      .gender-options {
        display: flex;
        gap: 40px;
      }

      .gender-label {
        display: flex;
        align-items: center;
        font-size: 14px;
        color: #333;
        cursor: pointer;
        font-weight: 400;
      }

      .gender-label input {
        margin-right: 8px;
        accent-color: #9b51e0; /* Màu tím cho radio button giống ảnh */
        width: 16px;
        height: 16px;
      }

      .btn-register {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        /* Gradient màu xanh sang tím chuẩn theo ảnh */
        background: linear-gradient(90deg, #5392e4 0%, #9b51e0 100%);
        transition: opacity 0.2s;
      }

      .btn-register:hover {
        opacity: 0.9;
      }

      /* Responsive cho màn hình điện thoại */
      @media (max-width: 600px) {
        .form-grid {
          grid-template-columns: 1fr;
          gap: 15px;
        }
        .gender-options {
          flex-direction: column;
          gap: 12px;
        }
        .container {
          padding: 20px;
          margin: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Registration</h2>

      <form action="#" method="POST">
        <div class="form-grid">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              placeholder="Enter your username"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              placeholder="Enter your number"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm your password"
              required
            />
          </div>
        </div>

        <div class="gender-section">
          <div class="gender-title">Gender</div>
          <div class="gender-options">
            <label class="gender-label">
              <input type="radio" name="gender" value="male" /> Male
            </label>
            <label class="gender-label">
              <input type="radio" name="gender" value="female" /> Female
            </label>
            <label class="gender-label">
              <input type="radio" name="gender" value="other" checked /> Prefer
              not to say
            </label>
          </div>
        </div>

        <button type="submit" class="btn-register">Register</button>
      </form>
    </div>
  </body>
</html>
